name: lilbee wheels

# Builds the xberg Python wheels lilbee pins from this fork branch and attaches
# them to a GitHub release on the fork. lilbee's pages.yml turns that release
# into the PEP 503 index at https://lilbee.sh/xberg/. The build job is the
# python-wheels job of publish.yaml at v1.0.14, unchanged, so the wheels match
# the PyPI ones apart from the patches on this branch and the +lilbee version.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Fork release tag that receives the wheels"
        required: true
        default: "xberg-v1.0.14+lilbee1"

permissions:
  contents: write

env:
  GLIBC_FLOOR: "2.28"

jobs:
  epub-tests:
    name: EPUB extractor unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: xberg-io/actions/setup-rust@v1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
      - name: Run the EPUB metadata tests
        run: cargo test -p xberg --lib extractors::epub

  python-wheels:
    name: Build Python wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Build wheels
        uses: xberg-io/actions/build-python-wheels@v1
        with:
          python-version: "3.13"
          package-dir: packages/python
          cibw-build: "cp310-*"
          upload-artifact: "false"
          build-libheif: "true"
          manylinux-x86_64-image: "manylinux_2_28"
          manylinux-aarch64-image: "manylinux_2_28"
          cibw-before-build-linux: |
            set -euo pipefail
            pip install maturin uv
            source ~/.cargo/env
            export CFLAGS="-std=gnu11"
            export CXXFLAGS="-std=gnu++17"
            export CPPFLAGS="-std=gnu11"
            export CMAKE_C_FLAGS="${CFLAGS}"
            export CMAKE_CXX_FLAGS="${CXXFLAGS}"
            export CC="gcc ${CFLAGS}"
            export CXX="g++ ${CXXFLAGS}"
            ort_version=1.24.2
            case "$(uname -m)" in aarch64 | arm64) ort_arch=aarch64 ;; *) ort_arch=x64 ;; esac
            curl -fsSL -o /tmp/ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ort_version}/onnxruntime-linux-${ort_arch}-${ort_version}.tgz"
            mkdir -p /opt/msort && tar -xzf /tmp/ort.tgz -C /opt/msort --strip-components=1
          cibw-environment: 'MATURIN_BUILD_ARGS="--compatibility manylinux_2_28" CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc CC_x86_64_unknown_linux_gnu=gcc CC_aarch64_unknown_linux_gnu=gcc CXX_x86_64_unknown_linux_gnu=g++ CXX_aarch64_unknown_linux_gnu=g++ ORT_STRATEGY=system ORT_LIB_LOCATION=/opt/msort/lib ORT_SKIP_DOWNLOAD=1 ORT_PREFER_DYNAMIC_LINK=1 LD_LIBRARY_PATH=/opt/msort/lib'
          cibw-before-build-macos: bash {project}/scripts/ci/build-macos-heif-deps.sh
          cibw-environment-macos: 'MATURIN_BUILD_ARGS="" CARGO_BUILD_LOCKED=true MACOSX_DEPLOYMENT_TARGET=11.0 PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig'
          cibw-before-build-windows: "rustup install 1.95-x86_64-pc-windows-msvc --profile minimal --component rust-src --component rustfmt --component clippy && rustup target add x86_64-pc-windows-msvc --toolchain 1.95-x86_64-pc-windows-msvc && pip install maturin uv && set PATH=%USERPROFILE%\\.cargo\\bin;%PATH%"
          cibw-environment-windows: 'MATURIN_BUILD_ARGS="--target x86_64-pc-windows-msvc" RUSTUP_TOOLCHAIN="1.95-x86_64-pc-windows-msvc" RUSTC_WRAPPER='

      - name: Vendor ONNX Runtime into wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for w in wheelhouse/*.whl; do bash scripts/ci/vendor-native-closure.sh "$w"; done

      - name: Verify wheel glibc floor + bundled ONNX Runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for w in wheelhouse/*.whl; do bash scripts/ci/verify-glibc-floor.sh "$w" "$GLIBC_FLOOR"; done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  smoke:
    # The books that motivated the branch: Internet Archive EPUB 3 files whose
    # OPF has more than 1024 elements and whose pages carry media-type text/html.
    name: Extract the Internet Archive EPUBs
    needs: [python-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: python-wheels-ubuntu-latest
          path: dist
      - name: Install the wheel
        run: pip install dist/xberg-*manylinux*x86_64.whl
      - name: Download the books
        run: |
          curl -sSL --retry 5 -o bscs.epub "https://archive.org/download/BSCS_Biology_A_Molecular_Approach_Student_Edition_by_McGraw-Hill_Education/BSCS_Biology_A_Molecular_Approach_Student_Edition_by_McGraw-Hill_Education.epub"
          curl -sSL --retry 5 -o insects.epub "https://archive.org/download/TheInsectsAnOutlineOfEntomology/The%20Insects%20%20An%20Outline%20of%20Entomology.epub"
      - name: Extract with default limits
        run: |
          python - <<'PY'
          import asyncio
          from xberg import ExtractionConfig, ExtractInput, ExtractInputKind, extract
          for name in ("bscs.epub", "insects.epub"):
              data = open(name, "rb").read()
              result = asyncio.run(extract(ExtractInput(kind=ExtractInputKind.BYTES, bytes=data, filename=name), ExtractionConfig()))
              assert not result.errors, result.errors
              content = result.results[0].content
              print(f"{name}: {len(content)} characters")
              assert len(content) > 1_000_000, f"{name} extracted only {len(content)} characters"
          PY

  release:
    name: Attach wheels to the fork release
    needs: [epub-tests, python-wheels, smoke]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: python-wheels-*
          path: wheels
          merge-multiple: true
      - name: Create or reuse the release
        run: |
          ls -l wheels
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --title "$TAG" --notes "xberg wheels for lilbee, built from $GITHUB_SHA."
      - name: Upload the wheels
        run: gh release upload "$TAG" wheels/*.whl --repo "$GITHUB_REPOSITORY" --clobber
